services:
  - type: web
    name: diawise
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerCommand: gunicorn --worker-class gthread --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: OPENAI_API_KEY
        sync: false # set manually in Render dashboard
      - key: PINECONE_API_KEY
        sync: false # set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true # Render generates and persists this automatically
